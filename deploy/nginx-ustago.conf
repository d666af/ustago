# UstaGo frontend — drop-in nginx snippet.
#
# Put this inside the server { ... } block that already answers on port 80
# for 167.172.163.54 (or include it as a separate file).
#
# Result: http://167.172.163.54/ustago/  →  static files from /var/www/ustago
# Does NOT touch the main app on :4173.

# Redirect /ustago → /ustago/ so relative paths (styles.css, app.js) resolve.
location = /ustago {
    return 301 /ustago/;
}

location /ustago/ {
    alias /var/www/ustago/;
    index index.html;
    try_files $uri $uri/ /ustago/index.html;

    # Cache static assets aggressively, but always revalidate index.html
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        alias /var/www/ustago/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location = /ustago/index.html {
        alias /var/www/ustago/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
