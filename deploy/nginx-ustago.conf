# UstaGo frontend — drop-in nginx snippet.
# Place inside an existing 'server { listen 80; ... }' block.

location = /ustago {
    return 301 /ustago/;
}

location /ustago/ {
    alias /var/www/ustago/;
    index index.html;
    try_files $uri $uri/ /ustago/index.html;

    # Always revalidate HTML so the SPA shell never goes stale
    location = /ustago/index.html {
        alias /var/www/ustago/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }
}
