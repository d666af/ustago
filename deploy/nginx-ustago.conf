# UstaGo frontend — drop-in nginx snippet.
#
# Place inside an existing 'server { listen 80; ... }' block.
# Result: http://<host>/ustago/  →  static files from /var/www/ustago
# Does NOT touch other locations on the same server.

location = /ustago {
    return 301 /ustago/;
}

location /ustago/ {
    alias /var/www/ustago/;
    index index.html;
    try_files $uri $uri/ /ustago/index.html;
}
